- id: treeport
  name: treeport whole-tree portability preflight
  description: >-
    Check every name in the Git index, the names a clone creates, for
    collisions and invalid names on the destination, including implicit
    parent collisions.
  entry: treeport git
  language: golang
  pass_filenames: false
  always_run: true
  require_serial: true
  args: [--profile, windows, --root, 'C:\checkout', .]
