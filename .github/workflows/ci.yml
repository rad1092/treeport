name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.0', '1.27.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Version and platform
        run: go version
      - name: Unit, regression, fuzz seed, and installed CLI tests
        run: go test -count=1 ./...
      - name: Native filesystem observations
        run: go test -count=1 -run TestNativeFilesystem -v ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Timed deterministic analysis fuzzing
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.1'
        run: go test -run='^$' -fuzz=FuzzCheckDeterministic -fuzztime=5s .
      - name: Check this checkout as a destination tree
        shell: bash
        run: go run ./cmd/treeport scan --profile windows --root 'C:\checkout' --json . > "$RUNNER_TEMP/treeport-report.json"
      - name: Preserve machine-readable portability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treeport-${{ runner.os }}-go${{ matrix.go }}
          path: ${{ runner.temp }}/treeport-report.json
          if-no-files-found: ignore
          retention-days: 14

